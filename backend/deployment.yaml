chartVersion: 0.2.8
project:
  name: "booking"
repository:
  name: "markmorcos/booking"
  path: "backend"
ingress:
  host: booking.morcos.tech
  rules:
    - host: booking.morcos.tech
      path: /(.*)
      pathType: ImplementationSpecific
      serviceName: booking-service
deployments:
  - name: booking-deployment
    image: markmorcos/booking
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef: { name: database-secret, key: DATABASE_URL }
      - name: FIREBASE_SERVICE_ACCOUNT_JSON
        valueFrom:
          secretKeyRef: { name: firebase-secret, key: FIREBASE_SERVICE_ACCOUNT_JSON }
      - name: WHATSAPP_ACCESS_TOKEN
        valueFrom:
          secretKeyRef: { name: whatsapp-secret, key: WHATSAPP_ACCESS_TOKEN }
      - name: WHATSAPP_PHONE_NUMBER_ID
        valueFrom:
          secretKeyRef: { name: whatsapp-secret, key: WHATSAPP_PHONE_NUMBER_ID }
      - name: SMTP_ADDRESS
        valueFrom:
          secretKeyRef: { name: smtp-secrets, key: SMTP_ADDRESS }
      - name: SMTP_PORT
        valueFrom:
          secretKeyRef: { name: smtp-secrets, key: SMTP_PORT }
      - name: SMTP_USERNAME
        valueFrom:
          secretKeyRef: { name: smtp-secrets, key: SMTP_USERNAME }
      - name: SMTP_PASSWORD
        valueFrom:
          secretKeyRef: { name: smtp-secrets, key: SMTP_PASSWORD }
      - name: SMTP_DOMAIN
        valueFrom:
          secretKeyRef: { name: smtp-secrets, key: SMTP_DOMAIN }
services:
  - name: booking-service
    port: 8080
jobs:
  - name: prepare-database-job
    image: markmorcos/booking
    command: ["/app/server", "-migrate"]
